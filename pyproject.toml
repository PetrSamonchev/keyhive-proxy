[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keyhive-proxy"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.9",
  "aiosqlite>=0.20",
  "click>=8.1",
  "httpx>=0.27",
  "keyring>=24.0",
  "pystray>=0.19",
  "Pillow>=10.0",
  "websockets>=12.0",
]

[project.scripts]
keyhive-proxy = "keyhive_proxy.main:cli"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx", "respx", "aiohttp"]

[tool.hatch.build.targets.wheel]
packages = ["src/keyhive_proxy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
