name: Release macOS

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag (e.g. v0.1.0)"
        required: true
  repository_dispatch:
    types: [release]

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e .
          pip install pyinstaller

      - name: Download cloudflared (darwin)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/cloudflare/cloudflared/releases/latest \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['tag_name'])")
          ARCH=$(uname -m | sed 's/x86_64/amd64/')
          mkdir -p src/keyhive_proxy/tray/assets
          curl -fL "https://github.com/cloudflare/cloudflared/releases/download/${VERSION}/cloudflared-darwin-${ARCH}.tgz" \
            -o /tmp/cloudflared.tgz
          tar -xzf /tmp/cloudflared.tgz -C src/keyhive_proxy/tray/assets/
          chmod +x src/keyhive_proxy/tray/assets/cloudflared
          echo "cloudflared $VERSION ($ARCH) SHA256: $(shasum -a 256 src/keyhive_proxy/tray/assets/cloudflared | awk '{print $1}')"

      - name: Generate icon
        run: |
          python3 -c "
          from PIL import Image, ImageDraw
          img = Image.new('RGBA', (1024, 1024), (0, 0, 0, 0))
          draw = ImageDraw.Draw(img)
          draw.ellipse([64, 64, 960, 960], fill=(34, 197, 94))
          img.save('src/keyhive_proxy/tray/assets/icon.icns', format='ICNS')
          "

      - name: Build .app bundle
        run: |
          pyinstaller --onefile --windowed \
            --add-data "src/keyhive_proxy/tray/assets:assets" \
            --icon src/keyhive_proxy/tray/assets/icon.icns \
            --name keyhive-proxy \
            src/keyhive_proxy/main.py

      - name: Package as DMG
        run: |
          TAG="${{ github.event.inputs.tag || github.event.client_payload.tag }}"
          hdiutil create \
            -volname "keyhive-proxy" \
            -srcfolder dist/keyhive-proxy.app \
            -ov -format UDZO \
            "keyhive-proxy-${TAG}-macos.dmg"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.event.client_payload.tag }}
          files: keyhive-proxy-*-macos.dmg
